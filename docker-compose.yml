services:
  # === Reverse proxy ===
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      - PUID=1000
      - PGID=1000
      - INITIAL_ADMIN_EMAIL=${NPM_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${NPM_PASSWORD}
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  # === CTFd platform ===
  ctfd:
    build: ./CTFd
    restart: always
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - ./data/CTFd/logs:/var/log/CTFd
      - ./data/CTFd/uploads:/var/uploads
      - ./CTFd:/opt/CTFd:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - proxy
      - internal

  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - ./data/CTFd/logs:/var/log/CTFd
      - ./data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]
    networks:
      - internal

  cache:
    image: redis:4
    restart: always
    volumes:
      - ./data/redis:/data
    networks:
      - internal

  # === Task sync (публикует CTFd и все таски в NPM при каждом up) ===
  npm-sync:
    build: ./scripts
    restart: "no"
    volumes:
      - ./scripts/sync-npm-hosts.sh:/app/sync-npm-hosts.sh:ro
      - ./tasks:/tasks:ro
    environment:
      - NPM_URL=http://npm:81
      - NPM_EMAIL=${NPM_EMAIL}
      - NPM_PASSWORD=${NPM_PASSWORD}
      - BASE_DOMAIN=${BASE_DOMAIN:-ctf.local}
      - DEFAULT_FORWARD_PORT=${DEFAULT_FORWARD_PORT:-8000}
      - DEFAULT_FORWARD_SCHEME=${DEFAULT_FORWARD_SCHEME:-http}
      - EXTERNAL_SCHEME=${EXTERNAL_SCHEME:-http}
      - DNS_PROVIDER=${DNS_PROVIDER:-}
      - DNS_PROVIDER_CREDENTIALS=${DNS_PROVIDER_CREDENTIALS:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # ждём, пока NPM поднимется и админ настроен (первый заход в UI)
        for i in $(seq 1 120); do
          if /app/sync-npm-hosts.sh; then
            exit 0
          fi
          sleep 5
        done
        echo "sync failed: NPM не готов или неверные креды в .env" >&2
        exit 1
    depends_on:
      npm:
        condition: service_started
    networks:
      - proxy

  # === Tasks generator (перегенерирует секцию тасок в compose при каждом up) ===
  tasks-sync:
    build: ./scripts
    restart: "no"
    volumes:
      - ./scripts/sync-tasks.sh:/app/sync-tasks.sh:ro
      - ./tasks:/tasks:ro
      - ./docker-compose.yml:/docker-compose.yml
    entrypoint: ["/bin/sh", "-c"]
    command: ["/app/sync-tasks.sh"]
    networks:
      - proxy

  # === CTFd sync (setup + создание челленджей при каждом up) ===
  ctfd-sync:
    build: ./scripts
    restart: "no"
    volumes:
      - ./scripts/sync-ctfd.sh:/app/sync-ctfd.sh:ro
      - ./tasks:/tasks:ro
    environment:
      - CTFD_URL=http://ctfd:8000
      - CTF_ADMIN_NAME=${CTF_ADMIN_NAME:-admin}
      - CTF_ADMIN_EMAIL=${CTF_ADMIN_EMAIL}
      - CTF_ADMIN_PASSWORD=${CTF_ADMIN_PASSWORD}
      - CTF_NAME=${CTF_NAME:-CTF}
      - CTF_DESCRIPTION=${CTF_DESCRIPTION:-}
      - CTF_MODE=${CTF_MODE:-users}
      - CTF_CHALLENGE_VISIBILITY=${CTF_CHALLENGE_VISIBILITY:-private}
      - CTF_ACCOUNT_VISIBILITY=${CTF_ACCOUNT_VISIBILITY:-public}
      - CTF_SCORE_VISIBILITY=${CTF_SCORE_VISIBILITY:-public}
      - CTF_REGISTRATION_VISIBILITY=${CTF_REGISTRATION_VISIBILITY:-public}
      - CTF_THEME=${CTF_THEME:-core-beta}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 120); do
          if /app/sync-ctfd.sh; then
            exit 0
          fi
          sleep 5
        done
        echo "sync failed: CTFd не готов или неверные креды в .env" >&2
        exit 1
    depends_on:
      ctfd:
        condition: service_started
    networks:
      - proxy

  # === Tasks / challenges (AUTOGENERATED by scripts/sync-tasks.sh) ===
  # Каждая таска живёт в tasks/<category>/<name>/ со своим Dockerfile.
  # Не редактируй этот блок вручную — запусти scripts/sync-tasks.sh
  # GENERATED_TASKS_START
  task-web-example:
    build: ./tasks/web/example
    restart: unless-stopped
    networks:
      - proxy
  # GENERATED_TASKS_END

networks:
  proxy:
    name: ctf_proxy
  internal:
    internal: true